services:
  postgres:
    image: postgres:17
    container_name: wewatch-postgres
    environment:
      POSTGRES_DB: wewatch
      POSTGRES_USER: wewatch
      POSTGRES_PASSWORD: wewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wewatch -d wewatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: wewatch-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wewatch
      DB_USER: wewatch
      DB_PASSWORD: wewatch
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      TMDB_API_KEY: ${TMDB_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: wewatch-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      # Deliberately unset (#408): this is the self-hosted topology nginx's X-Real-IP fallback
      # treats as untrusted -- no edge sits in front of nginx here, so a direct client could set
      # X-Real-IP to anything it likes. Leaving this blank is what keeps nginx ignoring inbound
      # X-Real-IP and using $remote_addr unconditionally, same as before #408.
      TRUST_EDGE_REAL_IP: ""
    ports:
      - "3000:80"

volumes:
  postgres-data:
