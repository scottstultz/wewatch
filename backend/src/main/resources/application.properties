spring.application.name=wewatch-api
google.client-id=${GOOGLE_CLIENT_ID}
tmdb.api-key=${TMDB_API_KEY}
tmdb.cache.ttl-days=7
tmdb.providers.ttl-hours=24

suggestions.cache.ttl-minutes=30
suggestions.cache.max-size=1000
suggestions.impressions.suppression-days=7
# Taste-profile tunables (#288) live in SuggestionTuningProperties
# (suggestions.tuning.*) with code defaults; the two below predate the
# extraction and are kept explicit. See the offline tuning harness at
# src/test/resources/tuning/README.md before changing any of them.
suggestions.tuning.half-life-days=90
suggestions.tuning.decay-floor=0.2

# 24h lifetime so the watch-and-return pattern (idle through a show) never
# outlives the token; the 12h refresh window slides active sessions forward
# without re-issuing on every response. See docs/architecture.md for the
# revocation trade-off and future hardening plan (#293).
jwt.expiration-seconds=86400
jwt.refresh-window-seconds=43200

http.client.connect-timeout-ms=2000
http.client.read-timeout-ms=5000

# Failed-attempt throttling on /api/auth (#318). In-memory, single-instance: each
# node throttles independently, so move to a shared store before horizontal scaling.
# The IP limit is higher than the email limit so a shared household IP is not locked out.
app.auth.throttle.email-max-attempts=5
app.auth.throttle.ip-max-attempts=20
app.auth.throttle.window-seconds=900

# "Returning this week" (#321). The nightly refresh is what keeps the episode cache
# current enough for the surface to be true — a season announced after a show's last
# prewarm is otherwise absent from the cache entirely. Scoped to WATCHING TV shows;
# set the cron to `-` to disable (handy in local dev, where it just burns TMDB quota).
app.episode-cache.refresh-cron=0 30 3 * * *
app.returning.default-days=7

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
