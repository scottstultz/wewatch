spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=none

jwt.secret=${JWT_SECRET}

tmdb.api-key=${TMDB_API_KEY}

app.cors.allowed-origins=https://we-watch.app

# Swagger UI / OpenAPI docs stay off in prod (#297). Redundant since #343 made the
# base default false, but kept explicit: prod must never serve the API surface
# anonymously, and this line is the record of that decision.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
