spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=none

jwt.secret=${JWT_SECRET}

tmdb.api-key=${TMDB_API_KEY}

app.cors.allowed-origins=https://we-watch.app

# #408: Railway private networking resolves the private domain over both IPv4 and IPv6 in this
# environment, and their own guidance is to bind [::] for dual-stack compatibility rather than
# rely on the JVM's default wildcard bind behaving the same way across every base image. Nowhere
# else in this repo sets server.address; scoped to prod only since local/docker-compose reaches
# the backend over its bridge network address, not Railway's private domain.
server.address=::

# Swagger UI / OpenAPI docs stay off in prod (#297). Redundant since #343 made the
# base default false, but kept explicit: prod must never serve the API surface
# anonymously, and this line is the record of that decision.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
